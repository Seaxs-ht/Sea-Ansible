<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_ROOT | Sea-Ansible</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        :root {
            --bg-core: #050505;
            --bg-panel: #0b0c10;
            --neon-cyan: #00f3ff;
            --neon-dim: rgba(0, 243, 255, 0.1);
            --text-main: #c5c6c7;
            --border-tech: 1px solid #1f2833;
        }

        body {
            background-color: var(--bg-core);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; /* Efecto rejilla */
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* --- Header Cyberpunk --- */
        .cyber-header {
            border-bottom: 1px solid var(--neon-cyan);
            background: linear-gradient(180deg, rgba(11,12,16,0.9) 0%, rgba(5,5,5,0.8) 100%);
            padding: 40px 0;
            position: relative;
            box-shadow: 0 0 20px var(--neon-dim);
            backdrop-filter: blur(5px);
        }

        .cyber-title {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -1px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .status-badge {
            font-size: 0.8rem;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 2px 8px;
            border-radius: 0;
            background: rgba(0, 243, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- Toolbar --- */
        .cyber-toolbar {
            background: rgba(11, 12, 16, 0.8);
            border-left: 3px solid var(--neon-cyan);
            border-top: 1px solid #1f2833;
            border-bottom: 1px solid #1f2833;
            border-right: 1px solid #1f2833;
            padding: 20px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        /* --- Botones Tech --- */
        .btn-cyber {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 0; /* Bordes cuadrados */
        }

        .btn-cyber:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .btn-cyber:disabled {
            border-color: #333;
            color: #555;
            box-shadow: none;
        }

        /* --- Tarjetas (Cards) --- */
        .cyber-card {
            background: var(--bg-panel);
            border: 1px solid #1f2833;
            position: relative;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            /* Clip-path para cortar la esquina superior derecha */
            clip-path: polygon(
                0 0, 
                calc(100% - 20px) 0, 
                100% 20px, 
                100% 100%, 
                0 100%
            );
        }

        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #1f2833;
            transition: 0.3s;
        }

        .cyber-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 30px -10px rgba(0, 243, 255, 0.15);
        }

        .cyber-card:hover::before {
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .card-body-tech {
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px currentColor;
            opacity: 0.8;
        }
        
        .file-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 0.75rem;
            color: #66fcf1;
            opacity: 0.6;
            margin-bottom: 20px;
        }

        /* Checkbox estilo Cyber */
        .cyber-check {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid var(--neon-cyan);
            background: transparent;
            cursor: pointer;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        .cyber-check:checked {
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Loader */
        .scan-loader {
            width: 100%;
            height: 4px;
            background: #111;
            overflow: hidden;
            position: relative;
            margin-top: 50px;
        }
        .scan-loader::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 40%;
            background: var(--neon-cyan);
            animation: scan 1.5s linear infinite;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        @keyframes scan {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* Icon Colors */
        .icon-yml { color: #ff0055; } /* Cyber Red */
        .icon-cfg { color: #ffd700; } /* Gold */
        .icon-txt { color: #c5c6c7; } /* Gray */
        .icon-dir { color: #00f3ff; } /* Cyan */

        /* Animación de entrada */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <header class="cyber-header">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h1 class="cyber-title mb-0">
                    <i class="fa-solid fa-terminal me-2"></i>NET_DEVOPS<span style="color:var(--neon-cyan)">_LAB</span>
                </h1>
                <small class="text-muted" style="font-family: 'JetBrains Mono';">Infrastructure as Code Repository</small>
            </div>
            <div class="text-end d-none d-md-block">
                <span class="status-badge">SYSTEM: ONLINE</span>
                <div class="text-muted" style="font-size: 0.7rem; margin-top:5px;">SECURE CONNECTION ESTABLISHED</div>
            </div>
        </div>
    </header>

    <div class="container mt-5">
        
        <div class="cyber-toolbar slide-in">
            <h5 class="m-0 text-white" style="font-weight: 300;">
                <i class="fa-solid fa-folder-tree me-2" style="color:var(--neon-cyan)"></i> /root/files
            </h5>
            <div class="d-flex gap-3">
                <button onclick="downloadAll()" class="btn btn-cyber">
                    <i class="fa-solid fa-file-zipper"></i> ZIP_ALL
                </button>
                <button onclick="downloadSelected()" id="btn-download-selected" class="btn btn-cyber" disabled>
                    <i class="fa-solid fa-download"></i> DL_SELECTED 
                    <span id="count-badge" class="badge bg-dark border border-info ms-1" style="display:none;">0</span>
                </button>
            </div>
        </div>

        <div id="loader-container">
            <p class="text-center text-info" style="font-family: 'JetBrains Mono'">INITIALIZING DATA FETCH...</p>
            <div class="scan-loader"></div>
        </div>

        <div class="row g-4" id="file-grid">
            </div>

    </div>

    <footer class="text-center py-5 mt-5" style="border-top: 1px solid #1f2833; color: #555;">
        <p style="font-family: 'JetBrains Mono'; font-size: 0.8rem;">
            TERMINAL SESSION ACTIVE &copy; 2026 <br>
            POWERED BY GITHUB REST API
        </p>
    </footer>

    <script>
        // --- CONFIGURACIÓN ---
        const USER = 'Seaxs-ht';
        const REPO = 'Sea-Ansible';
        const BRANCH = 'sea.ansible.github.io'; 

        let allFilesData = [];

        async function fetchRepoContents() {
            const grid = document.getElementById('file-grid');
            const loader = document.getElementById('loader-container');
            const url = `https://api.github.com/repos/${USER}/${REPO}/contents/?ref=${BRANCH}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Efecto de retardo mínimo para que se vea la animación de carga (profesionalidad)
                setTimeout(() => {
                    loader.style.display = 'none';
                    processFiles(data, grid);
                }, 800);

            } catch (error) {
                loader.innerHTML = `<p class="text-danger text-center">CRITICAL ERROR: CONNECTION FAILED <br> ${error.message}</p>`;
            }
        }

        function processFiles(data, grid) {
            allFilesData = data.filter(file => 
                file.name !== 'index.html' && 
                file.name !== '.git' && 
                file.name !== 'README.md'
            );

            if(allFilesData.length === 0) {
                grid.innerHTML = '<p class="text-center w-100 text-muted">DIRECTORY EMPTY</p>';
                return;
            }

            allFilesData.forEach((file, index) => {
                // Añadimos un pequeño retraso en la animación (staggering)
                const delay = index * 100; 
                grid.innerHTML += createCyberCard(file, delay);
            });
        }

        function createCyberCard(file, delay) {
            let iconClass = 'fa-file icon-txt';
            let typeCode = 'UNK';
            
            // Lógica de iconos y colores
            if (file.type === 'dir') { iconClass = 'fa-folder icon-dir'; typeCode = 'DIR'; }
            else if (file.name.match(/\.(yaml|yml)$/)) { iconClass = 'fa-code icon-yml'; typeCode = 'YAML'; }
            else if (file.name.match(/\.(cfg|conf|txt)$/)) { iconClass = 'fa-microchip icon-cfg'; typeCode = 'CONF'; }
            else if (file.name === 'Dockerfile') { iconClass = 'fa-brands fa-docker text-primary'; typeCode = 'DOCKR'; }

            const checkboxHtml = file.type !== 'dir' 
                ? `<input class="cyber-check" type="checkbox" value="${file.name}" onchange="updateSelection()">` 
                : '';

            const downloadBtn = file.type !== 'dir'
                ? `<button onclick="downloadSingle('${file.download_url}', '${file.name}')" class="btn btn-sm btn-outline-secondary w-100 mt-2" style="border-radius:0; font-size:0.7rem;">
                     <i class="fa-solid fa-download"></i> DOWNLOAD
                   </button>`
                : '';

            return `
                <div class="col-md-6 col-lg-3 fade-in-up" style="animation-delay: ${delay}ms">
                    <div class="cyber-card">
                        ${checkboxHtml}
                        <div class="card-body-tech text-center">
                            <div class="d-flex justify-content-end mb-2">
                                <span class="badge bg-transparent border border-secondary text-secondary" style="font-size:0.6rem">${typeCode}</span>
                            </div>
                            
                            <i class="fa-solid ${iconClass} file-icon"></i>
                            
                            <h6 class="file-name" title="${file.name}">${file.name}</h6>
                            <div class="file-meta">SIZE: ${file.size ? (file.size/1024).toFixed(2) + ' KB' : 'N/A'}</div>
                            
                            <div class="row g-1 mt-3">
                                <div class="col-6">
                                    <a href="${file.html_url}" target="_blank" class="btn btn-sm btn-outline-secondary w-100" style="border-radius:0; font-size:0.7rem;">
                                        <i class="fa-solid fa-eye"></i> VIEW
                                    </a>
                                </div>
                                <div class="col-6">
                                    ${file.type !== 'dir' ? 
                                    `<button onclick="downloadSingle('${file.download_url}', '${file.name}')" class="btn btn-sm btn-outline-info w-100" style="border-radius:0; font-size:0.7rem; border-color:var(--neon-cyan); color:var(--neon-cyan)">
                                        GET
                                     </button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- FUNCIONES DE DESCARGA (IGUAL QUE ANTES) ---
        function updateSelection() {
            const count = document.querySelectorAll('.cyber-check:checked').length;
            const btn = document.getElementById('btn-download-selected');
            const badge = document.getElementById('count-badge');

            if (count > 0) {
                btn.disabled = false;
                badge.innerText = count;
                badge.style.display = 'inline-block';
            } else {
                btn.disabled = true;
                badge.style.display = 'none';
            }
        }

        async function downloadSingle(url, filename) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                saveAs(blob, filename);
            } catch (e) { alert("ERROR_DL: " + e); }
        }

        async function downloadAll() {
            await createZip(allFilesData, "Ansible_Lab_Full_System.zip");
        }

        async function downloadSelected() {
            const checkboxes = document.querySelectorAll('.cyber-check:checked');
            const names = Array.from(checkboxes).map(cb => cb.value);
            const files = allFilesData.filter(f => names.includes(f.name));
            await createZip(files, "Ansible_Selected_Files.zip");
        }

        async function createZip(files, zipName) {
            const zip = new JSZip();
            const originalText = document.querySelector('.cyber-title').innerHTML;
            document.querySelector('.cyber-title').innerHTML = '<span class="text-warning">COMPRESSING DATA...</span>';

            try {
                const promises = files.map(async file => {
                    if(file.type === 'dir') return;
                    const res = await fetch(file.download_url);
                    const blob = await res.blob();
                    zip.file(file.name, blob);
                });
                await Promise.all(promises);
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, zipName);
                
                document.querySelectorAll('.cyber-check').forEach(cb => cb.checked = false);
                updateSelection();
            } catch (e) {
                alert("SYSTEM ERROR: " + e);
            } finally {
                document.querySelector('.cyber-title').innerHTML = originalText;
            }
        }

        // INICIAR SISTEMA
        fetchRepoContents();
    </script>
</body>
</html>
