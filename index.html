<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio NetDevOps | Sea-Ansible</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0f172a; /* Azul oscuro moderno */
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 60px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 40px;
        }
        .file-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            transition: all 0.3s ease;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: #38bdf8; /* Azul cielo al pasar ratón */
        }
        .icon-box {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .yaml-icon { color: #ef4444; } /* Rojo para YAML */
        .cfg-icon { color: #f59e0b; }  /* Naranja para Configs */
        .txt-icon { color: #94a3b8; }  /* Gris para texto */
        .folder-icon { color: #3b82f6; } /* Azul para carpetas */
        
        .btn-custom {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            width: 100%;
            margin-top: 10px;
        }
        .btn-custom:hover {
            background-color: #7dd3fc;
            color: #0f172a;
        }
        .badge-type {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            opacity: 0.7;
        }
        /* Loader de carga */
        #loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
    </style>
</head>
<body>

    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold"><i class="fa-solid fa-network-wired"></i> Portal NetDevOps</h1>
            <p class="lead text-secondary">Repositorio de Automatización con Ansible & Cisco</p>
            <p class="small text-muted">Archivos sincronizados automáticamente desde GitHub</p>
        </div>
    </div>

    <div class="container mb-5">
        <div id="loader">
            <div class="spinner-border text-info" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
        
        <div class="row g-4" id="file-grid">
            </div>
    </div>

    <footer class="text-center py-4 border-top border-secondary mt-auto">
        <p class="text-muted small">&copy; 2026 Ingeniería de Automatización | Powered by GitHub API</p>
    </footer>

    <script>
        // CONFIGURACIÓN: TUS DATOS DE GITHUB
        const USER = 'Seaxs-ht';
        const REPO = 'Sea-Ansible';
        // Rama donde están los archivos (según tus capturas es esta)
        const BRANCH = 'sea.ansible.github.io'; 

        async function fetchRepoContents() {
            const grid = document.getElementById('file-grid');
            const loader = document.getElementById('loader');
            
            // URL de la API de GitHub
            const url = `https://api.github.com/repos/${USER}/${REPO}/contents/?ref=${BRANCH}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Ocultar loader
                loader.style.display = 'none';

                // Filtrar archivos que NO queremos mostrar
                const files = data.filter(file => 
                    file.name !== 'index.html' && 
                    file.name !== '.git' &&
                    file.name !== 'README.md'
                );

                files.forEach(file => {
                    const card = createCard(file);
                    grid.innerHTML += card;
                });

            } catch (error) {
                loader.innerHTML = `<p class="text-danger">Error al cargar archivos: ${error.message}</p>`;
                console.error(error);
            }
        }

        function createCard(file) {
            let iconClass = 'fa-file txt-icon';
            let typeName = 'FILE';
            
            // Asignar iconos según extensión
            if (file.type === 'dir') {
                iconClass = 'fa-folder folder-icon';
                typeName = 'FOLDER';
            } else if (file.name.endsWith('.yaml') || file.name.endsWith('.yml')) {
                iconClass = 'fa-code yaml-icon';
                typeName = 'PLAYBOOK';
            } else if (file.name.endsWith('.cfg') || file.name.endsWith('.conf')) {
                iconClass = 'fa-gears cfg-icon';
                typeName = 'CONFIG';
            } else if (file.name === 'Dockerfile') {
                iconClass = 'fa-brands fa-docker text-primary';
                typeName = 'DOCKER';
            }

            // Link de descarga/visualización
            // Si es carpeta, lleva al árbol de GitHub. Si es archivo, a la vista blob.
            const linkUrl = file.html_url;

            return `
                <div class="col-md-4 col-lg-3">
                    <div class="file-card p-4 text-center">
                        <span class="badge bg-secondary badge-type">${typeName}</span>
                        <div class="icon-box">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                        <h5 class="card-title text-truncate" title="${file.name}">${file.name}</h5>
                        <p class="text-muted small mb-4">${(file.size / 1024).toFixed(1)} KB</p>
                        
                        <a href="${linkUrl}" target="_blank" class="btn btn-custom btn-sm">
                            <i class="fa-solid fa-download"></i> Ver / Descargar
                        </a>
                    </div>
                </div>
            `;
        }

        // Ejecutar al cargar la página
        fetchRepoContents();
    </script>
</body>
</html>
